<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Karanlık Koridor · Korku Oyunu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0b0a0c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 12px;
            touch-action: manipulation;
        }
        #game-container {
            max-width: 720px;
            width: 100%;
            background: #141115;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px #3a2a33 inset;
            padding: 18px 18px 24px;
            transition: all 0.2s;
        }
        #display {
            background: #1c161b;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 30px rgba(80, 20, 30, 0.6);
            border: 1px solid #3d2a30;
            touch-action: none;
        }
        #scene-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0f0b0d;
            object-fit: cover;
            image-rendering: crisp-edges;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            pointer-events: auto;
        }
        #menu-btn {
            background: rgba(30, 20, 25, 0.7);
            backdrop-filter: blur(6px);
            border: 1px solid #6a4a54;
            color: #f0d5d5;
            font-size: 1.2rem;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.2s;
            pointer-events: auto;
            cursor: pointer;
        }
        #menu-btn:active { transform: scale(0.94); background: #3d2630; }
        #scene-title {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            padding: 6px 18px;
            border-radius: 60px;
            color: #ebd6d6;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid #5d3f48;
            text-shadow: 0 0 12px #350000;
            pointer-events: none;
        }
        #action-area {
            position: absolute;
            bottom: 24px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 0 16px;
            pointer-events: none;
        }
        .action-btn {
            pointer-events: auto;
            background: rgba(20, 12, 16, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid #7a565f;
            color: #f2e0e0;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            transition: 0.15s;
            min-width: 100px;
            text-align: center;
            border-bottom: 3px solid #a55b6b;
            text-shadow: 0 2px 4px black;
            touch-action: manipulation;
            cursor: pointer;
        }
        .action-btn:active { transform: scale(0.92); background: #281d22; }
        .action-btn.secondary {
            background: rgba(40, 25, 30, 0.8);
            border-bottom-color: #6f4a52;
            min-width: 80px;
        }
        #bottom-menu {
            display: flex;
            justify-content: space-around;
            margin-top: 18px;
            padding: 8px 12px;
            background: #1f181d;
            border-radius: 80px;
            border: 1px solid #3c2a30;
            backdrop-filter: blur(4px);
            gap: 6px;
            flex-wrap: wrap;
        }
        .menu-item {
            background: transparent;
            border: none;
            color: #bea3a8;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 8px 12px;
            border-radius: 40px;
            transition: 0.2s;
            letter-spacing: 0.3px;
            flex: 1 0 auto;
            text-align: center;
            background: rgba(60, 40, 48, 0.2);
            border: 1px solid transparent;
            touch-action: manipulation;
            cursor: pointer;
        }
        .menu-item.active {
            background: #3b2630;
            color: #f5dddd;
            border-color: #936a78;
            box-shadow: 0 0 16px #5f2e3e;
        }
        .menu-item:active { transform: scale(0.92); background: #432f38; }
        #info-text {
            color: #7a5f66;
            text-align: center;
            font-size: 0.7rem;
            margin-top: 14px;
            letter-spacing: 0.8px;
            opacity: 0.8;
        }
        @media (max-width: 500px) {
            #game-container { padding: 10px; border-radius: 32px; }
            .action-btn { padding: 10px 14px; font-size: 0.85rem; min-width: 70px; }
            #scene-title { font-size: 0.7rem; padding: 4px 12px; }
            #menu-btn { font-size: 1rem; padding: 4px 14px; }
            .menu-item { font-size: 0.7rem; padding: 6px 8px; }
        }
    </style>
</head>
<body>
<div id="game-container">
    <div id="display">
        <canvas id="scene-canvas" width="720" height="405"></canvas>
        <div id="ui-overlay">
            <div id="top-bar">
                <button id="menu-btn">☯ MENU</button>
                <span id="scene-title">KORİDOR</span>
                <div style="width: 50px;"></div>
            </div>
            <div id="action-area">
                <button class="action-btn" id="left-btn">◀ SOL</button>
                <button class="action-btn secondary" id="action-btn">📖 İNCELE</button>
                <button class="action-btn" id="right-btn">SAĞ ▶</button>
            </div>
        </div>
    </div>

    <div id="bottom-menu">
        <button class="menu-item active" data-scene="0">⚰️ Giriş</button>
        <button class="menu-item" data-scene="1">🕯️ Salon</button>
        <button class="menu-item" data-scene="2">🚪 Oda</button>
        <button class="menu-item" data-scene="3">🌑 Koridor</button>
        <button class="menu-item" data-scene="4">🩸 Bodrum</button>
    </div>
    <div id="info-text">▼ korku seni bekliyor · kulaklık önerilir</div>
</div>
<script>
    (function(){
        // ------- SAHNELER (5 farklı korku sahnesi) -------
        const SCENES = [
            { 
                id: 0, 
                title: 'GİRİŞ · YALNIZLIK', 
                desc: 'Eski bir malikanenin girişi. Kapı ardına kadar açık. İçeriden soğuk bir rüzgar esiyor.',
                bg: '#0f0b0e',
                details: 'Duvarda asılı bir tablo, gözleri takip ediyor sanki.',
                actionText: 'Fısıltı duy',
                actionEffect: 'Kulaklarında bir fısıltı… "Gel…"',
                leftAction: 'Koridora gir',
                rightAction: 'Merdivenlere yönel'
            },
            { 
                id: 1, 
                title: 'SALON · KAN LEKELERİ', 
                desc: 'Büyük salon, avizeden sarkan gölgeler. Yerde eski kan lekeleri var.',
                bg: '#161011',
                details: 'Piyano kendi kendine bir nota çalıyor…',
                actionText: 'Piyanoyu incele',
                actionEffect: 'Bir nota daha… "Si bemol"… tüyler ürpertici.',
                leftAction: 'Mutfak geçidi',
                rightAction: 'Kütüphaneye'
            },
            { 
                id: 2, 
                title: 'ODA · AYNA', 
                desc: 'Tozlu bir yatak odası. Devasa bir ayna, yansımanı bozuk gösteriyor.',
                bg: '#130e12',
                details: 'Aynada arkanda bir silüet beliriyor… kimse yok.',
                actionText: 'Aynaya dokun',
                actionEffect: 'Parmak izin camda kalıyor… sanki içeriden biri dokundu.',
                leftAction: 'Hol',
                rightAction: 'Tuvalet'
            },
            { 
                id: 3, 
                title: 'KORİDOR · SONSUZLUK', 
                desc: 'Uzun, karanlık koridor. Duvarlarda eski fotoğraflar, gözleri kırmızı.',
                bg: '#0c090b',
                details: 'Adımların yankılanıyor… ama sanki iki kişi yürüyor.',
                actionText: 'Feneri yak',
                actionEffect: 'Işık bir an için bir çift göz aydınlatıyor… kayboluyor.',
                leftAction: 'Kuzey kanadı',
                rightAction: 'Güney kanadı'
            },
            { 
                id: 4, 
                title: 'BODRUM · NEM KOKUSU', 
                desc: 'Nemli bodrum. Duvarlarda tuhaf semboller. Zemin çamur gibi.',
                bg: '#0a0709',
                details: 'Bir kazı sesi… sanki biri kazıyor.',
                actionText: 'Sesi takip et',
                actionEffect: 'Ses aniden kesildi… ama nefesini duyuyorsun.',
                leftAction: 'Tünele gir',
                rightAction: 'Merdivenlerden kaç'
            }
        ];

        // ----- OYUN DURUMU -----
        let currentSceneIndex = 0;
        let currentScene = SCENES[0];
        let messageTimeout = null;

        // DOM referansları
        const canvas = document.getElementById('scene-canvas');
        const ctx = canvas.getContext('2d');
        const sceneTitle = document.getElementById('scene-title');
        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');
        const actionBtn = document.getElementById('action-btn');
        const menuBtns = document.querySelectorAll('.menu-item');
        const menuBtn = document.getElementById('menu-btn');

        // ----- ÇİZİM (profesyonel atmosfer) -----
        function drawScene(scene) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Arka plan
            const grad = ctx.createRadialGradient(360, 200, 40, 360, 200, 400);
            grad.addColorStop(0, scene.bg || '#1a1116');
            grad.addColorStop(0.7, '#0b070a');
            grad.addColorStop(1, '#030103');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vinyet efekti
            const vignette = ctx.createRadialGradient(360, 200, 100, 360, 200, 450);
            vignette.addColorStop(0, 'rgba(0,0,0,0)');
            vignette.addColorStop(0.8, 'rgba(0,0,0,0.3)');
            vignette.addColorStop(1, 'rgba(0,0,0,0.7)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Doku efekti (ince çizgiler)
            ctx.strokeStyle = 'rgba(80, 40, 50, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 20; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * 22 + 10);
                ctx.lineTo(canvas.width, i * 18 + 40);
                ctx.stroke();
            }

            // Sahne özel sembolleri / korku ögeleri
            ctx.shadowColor = 'rgba(100, 20, 20, 0.5)';
            ctx.shadowBlur = 20;
            
            // her sahne için farklı görsel ipucu
            if (scene.id === 0) {
                // kapı silüeti
                ctx.fillStyle = '#1f141a';
                ctx.shadowBlur = 30;
                ctx.fillRect(200, 60, 320, 280);
                ctx.fillStyle = '#2d1b23';
                ctx.fillRect(280, 140, 60, 120);
                ctx.fillStyle = '#3a222c';
                ctx.beginPath();
                ctx.arc(320, 200, 20, 0, Math.PI*2);
                ctx.fill();
            } else if (scene.id === 1) {
                // piyano
                ctx.fillStyle = '#1f171b';
                ctx.fillRect(100, 200, 200, 70);
                ctx.fillStyle = '#2d1f24';
                for (let i=0; i<12; i++) {
                    ctx.fillRect(120 + i*15, 170, 8, 40);
                }
            } else if (scene.id === 2) {
                // ayna
                ctx.strokeStyle = '#5a3f47';
                ctx.lineWidth = 6;
                ctx.strokeRect(240, 60, 200, 260);
                ctx.fillStyle = 'rgba(50, 30, 35, 0.3)';
                ctx.fillRect(250, 70, 180, 240);
                // silüet
                ctx.fillStyle = 'rgba(20, 10, 12, 0.5)';
                ctx.beginPath();
                ctx.arc(340, 190, 30, 0, Math.PI*2);
                ctx.fill();
            } else if (scene.id === 3) {
                // fotoğraf çerçeveleri
                for (let i=0; i<3; i++) {
                    ctx.strokeStyle = '#3d2a30';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(100 + i*160, 80, 70, 90);
                    ctx.fillStyle = 'rgba(40, 20, 25, 0.2)';
                    ctx.fillRect(108 + i*160, 88, 54, 74);
                }
            } else if (scene.id === 4) {
                // semboller
                ctx.strokeStyle = '#5a2e38';
                ctx.lineWidth = 3;
                for (let i=0; i<5; i++) {
                    ctx.beginPath();
                    ctx.arc(140 + i*100, 300, 20, 0, Math.PI*2);
                    ctx.stroke();
                }
            }

            // sis efekti
            ctx.shadowBlur = 0;
            const fog = ctx.createRadialGradient(400, 100, 50, 300, 150, 400);
            fog.addColorStop(0, 'rgba(50, 40, 45, 0.05)');
            fog.addColorStop(1, 'rgba(0,0,0,0.15)');
            ctx.fillStyle = fog;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // alt yazı (sahne detayı)
            ctx.shadowBlur = 12;
            ctx.shadowColor = 'black';
            ctx.fillStyle = '#c6a7ae';
            ctx.font = '13px "Segoe UI", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('▸ ' + scene.desc.substring(0, 48) + '…', 360, 380);
            
            // küçük detay
            ctx.font = '10px monospace';
            ctx.fillStyle = '#5e414a';
            ctx.fillText('✦ ' + scene.details, 360, 398);
        }

        // ----- OYUN GÜNCELLEME -----
        function updateUI(scene) {
            currentScene = scene;
            sceneTitle.textContent = scene.title.toUpperCase();
            actionBtn.textContent = scene.actionText || 'İNCELE';
            leftBtn.textContent = scene.leftAction || '◀ SOL';
            rightBtn.textContent = scene.rightAction || 'SAĞ ▶';
            drawScene(scene);

            // menü aktif
            menuBtns.forEach((btn, idx) => {
                btn.classList.toggle('active', parseInt(btn.dataset.scene) === scene.id);
            });
        }

        // ----- SAHNE DEĞİŞTİR (geçiş efekti) -----
        function goToScene(index) {
            if (index < 0 || index >= SCENES.length) return;
            currentSceneIndex = index;
            const newScene = SCENES[index];
            updateUI(newScene);
            // kısa mesaj
            showFloatingMessage(newScene.details, 1800);
        }

        // geçici mesaj
        function showFloatingMessage(msg, duration = 2000) {
            const titleEl = document.getElementById('scene-title');
            const original = titleEl.textContent;
            titleEl.textContent = '⚠️ ' + msg.substring(0, 40);
            titleEl.style.color = '#eac2c2';
            if (messageTimeout) clearTimeout(messageTimeout);
            messageTimeout = setTimeout(() => {
                titleEl.textContent = original;
                titleEl.style.color = '';
                messageTimeout = null;
            }, duration);
        }

        // ----- AKSİYON BUTONLARI -----
        function handleAction() {
            const scene = currentScene;
            const effect = scene.actionEffect || 'Bir şey hissettin...';
            showFloatingMessage(effect, 2200);
            // görsel tepki
            ctx.shadowBlur = 60;
            ctx.fillStyle = 'rgba(70, 20, 20, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            setTimeout(() => drawScene(scene), 300);
        }

        function handleLeft() {
            let newIdx = (currentSceneIndex - 1 + SCENES.length) % SCENES.length;
            goToScene(newIdx);
            showFloatingMessage('⏎ ' + SCENES[newIdx].title, 1000);
        }

        function handleRight() {
            let newIdx = (currentSceneIndex + 1) % SCENES.length;
            goToScene(newIdx);
            showFloatingMessage('⏎ ' + SCENES[newIdx].title, 1000);
        }

        // ----- MENÜ (hızlı geçiş) -----
        function setupMenu() {
            menuBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(btn.dataset.scene);
                    if (!isNaN(idx) && idx !== currentSceneIndex) {
                        goToScene(idx);
                        showFloatingMessage('⟳ ' + SCENES[idx].title, 900);
                    }
                });
                btn.addEventListener('touchstart', (e) => {
                    // mobil dokunma
                }, {passive: true});
            });
        }

        // ----- MENU BUTONU (oyun içi) -----
        function toggleMenu() {
            const bottom = document.getElementById('bottom-menu');
            const isHidden = bottom.style.display === 'none';
            bottom.style.display = isHidden ? 'flex' : 'none';
            showFloatingMessage(isHidden ? 'MENU AÇIK' : 'MENU KAPALI', 800);
        }

        // ----- BAŞLAT -----
        function init() {
            // canvas boyutlandırma
            const rect = canvas.getBoundingClientRect();
            if (rect.width > 0) {
                canvas.width = 720;
                canvas.height = 405;
            }
            // ilk sahne
            currentSceneIndex = 0;
            updateUI(SCENES[0]);
            // eventler
            actionBtn.addEventListener('click', handleAction);
            leftBtn.addEventListener('click', handleLeft);
            rightBtn.addEventListener('click', handleRight);
            menuBtn.addEventListener('click', toggleMenu);
            // mobil dokunma desteği
            [actionBtn, leftBtn, rightBtn, menuBtn].forEach(el => {
                el.addEventListener('touchstart', (e) => {
                    e.preventDefault(); // tıklama çakışması
                }, {passive: false});
            });
            setupMenu();
            // alt menü başlangıçta açık
            document.getElementById('bottom-menu').style.display = 'flex';
            // canvas yeniden çizim
            window.addEventListener('resize', () => { drawScene(currentScene); });
            // ekstra korku: zamanlayıcı ile fısıltı
            setInterval(() => {
                if (Math.random() < 0.15) {
                    const whispers = ['… neden geldin?', '… arkana bak.', '… yalnız değilsin.', '… kaç!'];
                    showFloatingMessage('✦ ' + whispers[Math.floor(Math.random()*whispers.length)], 1400);
                }
            }, 8000);
        }

        // DOM hazır
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
</script>
</body>
            </html>
