<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYMAR</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,Helvetica,sans-serif;
}

body{

background-image:url("1000063767.png");
background-size:cover;
background-position:center;
background-repeat:no-repeat;

display:flex;
justify-content:center;
align-items:flex-end;

}

body::before{

content:"";

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

background:rgba(0,0,0,.20);

}

#press{

position:absolute;

bottom:120px;

left:50%;

transform:translateX(-50%);

color:white;

font-size:32px;

font-weight:bold;

letter-spacing:4px;

text-shadow:0 0 20px white;

animation:blink 1.5s infinite;

z-index:5;

user-select:none;

}

@keyframes blink{

0%{
opacity:1;
}

50%{
opacity:.15;
}

100%{
opacity:1;
}

}

#rotate{

display:none;

position:fixed;

left:0;

top:0;

width:100%;

height:100%;

background:black;

color:white;

z-index:999;

justify-content:center;

align-items:center;

text-align:center;

font-size:30px;

padding:30px;

}

.slide{

animation:slide .8s forwards;

}

@keyframes slide{

0%{
transform:translateY(0);
}

100%{
transform:translateY(-100%);
}

}

</style>

</head>

<body>

<div id="rotate">

📱<br><br>

Lütfen telefonunu yatay çevir.

</div>

<div id="press">

OYNAMAK İÇİN HERHANGİ BİR TUŞA BASIN

</div>

<script>

function orientation(){

if(window.innerHeight>window.innerWidth){

document.getElementById("rotate").style.display="flex";

}else{

document.getElementById("rotate").style.display="none";

}

}

orientation();

window.addEventListener("resize",orientation);

let opened=false;

function start(){

if(opened)return;

opened=true;

document.body.classList.add("slide");

setTimeout(function(){

location.href="main-menu/index.html";

},800);

}

document.addEventListener("keydown",start);

document.addEventListener("click",start);

document.addEventListener("touchstart",start);

</script>

</body>
</html>
